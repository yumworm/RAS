# Rokit toolchain manifest. Pins every tool the project builds and checks with, so
# local dev and CI use identical versions. Install with `rokit install`
# (https://github.com/rojo-rbx/rokit).
[tools]
rojo = "rojo-rbx/rojo@7.5.1"
stylua = "JohnnyMorganz/StyLua@2.5.2"
selene = "Kampfkarren/selene@0.28.0"
luau-lsp = "JohnnyMorganz/luau-lsp@1.32.1"
